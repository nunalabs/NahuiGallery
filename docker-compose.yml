# ==========================================
# Volumes
# ==========================================

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  # ipfs_data:
  #   driver: local
  # elasticsearch_data:
  #   driver: local

# ==========================================
# Networks
# ==========================================

networks:
  nahui-network:
    driver: bridge
    name: nahui-network
